  function getTime() {
    const n = new Date();
    return n.getHours().toString().padStart(2,'0') + ':' + n.getMinutes().toString().padStart(2,'0');
  }

  function showTyping(duration) {
    return new Promise(resolve => {
      document.getElementById('typingIndicator').style.display = 'flex';
      document.getElementById('chatBody').scrollTop = document.getElementById('chatBody').scrollHeight;
      setTimeout(() => {
        document.getElementById('typingIndicator').style.display = 'none';
        resolve();
      }, duration);
    });
  }

  function addMsg(text, type) {
    const b = document.getElementById('chatBody');
    const div = document.createElement('div');
    div.className = 'msg ' + (type || 'received');
    div.innerHTML = text + '<div class="msg-time">' + getTime() + '</div>';
    const typing = document.getElementById('typingIndicator');
    b.insertBefore(div, typing);
    b.scrollTop = b.scrollHeight;
  }

  function addOptions(html) {
    document.getElementById('quickOptions').innerHTML = html;
    document.getElementById('quickOptions').classList.remove('hidden');
    document.getElementById('contactForm').classList.add('hidden');
  }

  function showContactForm() {
    document.getElementById('quickOptions').classList.add('hidden');
    document.getElementById('contactForm').classList.remove('hidden');
  }

  async function init() {
    addMsg('<b>🌍</b> Please select your language | الرجاء اختيار اللغة');
    addOptions(`
      <button class="option-btn" onclick="selectLang('ar')"><span class="opt-icon">🇸🇦</span> العربية</button>
      <button class="option-btn" onclick="selectLang('en')"><span class="opt-icon">🇬🇧</span> English</button>
    `);
  }

  async function selectLang(lang) {
    chatLang = lang;
    const data = chatData[lang];
    
    addMsg(lang === 'ar' ? '🇸🇦 العربية' : '🇬🇧 English', 'sent');
    await showTyping(1200);
    addMsg(data.welcome);
    showCategories();
  }

  function showCategories() {
    const data = chatData[chatLang];
    document.getElementById('contactForm').classList.add('hidden');
    document.getElementById('quickOptions').classList.remove('hidden');
    
    let html = '';
    data.categories.forEach(cat => {
      html += `<button class="option-btn" onclick="showQuestions('${cat.id}')"><span class="opt-icon">${cat.icon}</span> ${cat.title}</button>`;
    });
    addOptions(html);
  }

  async function showQuestions(catId) {
    const data = chatData[chatLang];
    const cat = data.questions[catId];
    
    addMsg(cat.title, 'sent');
    await showTyping(800);
    
    let html = `<button class="option-btn back-option" onclick="showCategories()">${data.back}</button>`;
    cat.list.forEach((item, i) => {
      html += `<button class="option-btn" onclick="showAnswer('${catId}', ${i})"><span class="opt-icon">❓</span> ${item.q}</button>`;
    });
    addOptions(html);
  }

  async function showAnswer(catId, index) {
    const data = chatData[chatLang];
    const item = data.questions[catId].list[index];
    
    addMsg(item.q, 'sent');
    
    if (item.a === 'contact') {
      await showTyping(1000);
      addMsg(chatLang === 'ar' ? 'سنقوم بتوصيلك مع فريق الدعم. يرجى ترك رسالتك أدناه وسنرد عليك في أقرب وقت ممكن.' : 'We will connect you with our support team. Please leave your message below and we will respond as soon as possible.');
      showContactForm();
      return;
    }
    
    document.getElementById('quickOptions').innerHTML = '';
    await showTyping(1800);
    addMsg(item.a);
    showQuestions(catId);
  }

  async function submitContact() {
    const name = document.getElementById('cfName').value.trim();
    const email = document.getElementById('cfEmail').value.trim();
    const message = document.getElementById('cfMessage').value.trim();

    if (!name || !email || !message) {
      alert(chatLang === 'ar' ? 'يرجى ملء جميع الحقول' : 'Please fill all fields');
      return;
    }

    try {
      await firebase.firestore().collection('support_messages').add({
        from: name, email: email, message: message,
        date: new Date().toLocaleDateString(chatLang === 'ar' ? 'ar-SA' : 'en-US'),
        createdAt: new Date().toISOString()
      });
    } catch(e) {
      const messages = JSON.parse(localStorage.getItem('eot_support_messages') || '[]');
      messages.push({ from: name, email: email, message: message, date: new Date().toLocaleDateString(chatLang === 'ar' ? 'ar-SA' : 'en-US') });
      localStorage.setItem('eot_support_messages', JSON.stringify(messages));
    }
emailjs.send("service_74qw0wt", "template_nuutvfi", {
  type: 'دعم - رسالة من المحادثة',
  name: name,
  email: email,
  amount: message,
  date: new Date().toLocaleDateString('ar-SA')
}).catch(err => console.log('EmailJS error:', err));

    addMsg(chatLang === 'ar' ? '✅ تم إرسال رسالتك بنجاح! سنرد عليك في أقرب وقت ممكن.' : '✅ Your message has been sent successfully! We will reply as soon as possible.');
    document.getElementById('cfName').value = '';
    document.getElementById('cfEmail').value = '';

    document.getElementById('contactForm').classList.add('hidden');
    showCategories();
